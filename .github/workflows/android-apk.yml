name: Build Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile GHSS Larnoo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Native Git - No Node.js Action)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: Configure JDK 17, Android SDK & Gradle 8.11.1
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build Installable Android APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GHSS-Larnoo-Result-Mgt.apk
          ls -lh GHSS-Larnoo-Result-Mgt.apk

      - name: Publish APK to GitHub Releases & Summary Page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk GHSS-Larnoo-Result-Mgt.apk \
            --title "GHSS Larnoo Android App (Installable APK)" \
            --notes "Official Android APK for GHSS Larnoo Student Result & Assessment Management System. Download **GHSS-Larnoo-Result-Mgt.apk** below to install on any Android phone or tablet."

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/GHSS-Larnoo-Result-Mgt.apk"
          {
            echo "## GHSS Larnoo Android APK Ready"
            echo ""
            echo "Your Android APK has been compiled and signed:"
            echo ""
            echo "### [Click Here to Download GHSS-Larnoo-Result-Mgt.apk](${DOWNLOAD_URL})"
            echo ""
            echo "You can also find it at any time on your repository's **Releases** section."
          } >> "$GITHUB_STEP_SUMMARY"
